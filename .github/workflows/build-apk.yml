name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 新版 sdkmanager 强制要求 JDK 17+，先用 17 装 SDK 包
      - name: Set up JDK 17 (for Android SDK tools)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          echo "using $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-31" "build-tools;31.0.0"

      # AGP 7.0.4 + Kotlin 1.5.0 只在 JDK 11 上稳
      - name: Set up JDK 11 (for Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Generate self-use keystore
        run: |
          keytool -genkeypair -v -keystore selfuse.jks -alias selfuse \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=SelfUse, OU=SelfUse, O=SelfUse, L=CN, ST=CN, C=CN"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :nga_phone_base_3.0:assembleRelease --stacktrace --no-daemon

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nga-selfuse-apk
          path: nga_phone_base_3.0/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
