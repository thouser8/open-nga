name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-31" "build-tools;31.0.0"

      - name: Generate self-use keystore
        run: |
          keytool -genkeypair -v -keystore selfuse.jks -alias selfuse \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=SelfUse, OU=SelfUse, O=SelfUse, L=CN, ST=CN, C=CN"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :nga_phone_base_3.0:assembleRelease --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nga-selfuse-apk
          path: nga_phone_base_3.0/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
